; Optional reproducible build, same sketch as Arduino IDE.
[platformio]
src_dir = firmware/PrintFleet
[env:esp32-s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = firmware/PrintFleet/partitions.csv
build_flags = -DBOARD_HAS_PSRAM
lib_deps = bblanchon/ArduinoJson@7.3.1
monitor_speed = 115200
